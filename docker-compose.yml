services:
  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - inzozi

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Inzozi Code}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AQUILA_PROVIDER: ${AQUILA_PROVIDER:-openai}
      AQUILA_MODEL: ${AQUILA_MODEL:-gpt-5.6}
      AQUILA_MAX_TURNS: ${AQUILA_MAX_TURNS:-12}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-5.6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WORKSPACE_SERVICE_URL: ${WORKSPACE_SERVICE_URL:-http://workspace:8100}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_OWNER: ${GITHUB_APP_OWNER:-}
      GITHUB_APP_DEFAULT_INSTALLATION_ID: ${GITHUB_APP_DEFAULT_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      workspace:
        condition: service_healthy
    networks:
      - inzozi

  workspace:
    build:
      context: ./services/workspace/runtime
    restart: unless-stopped
    environment:
      WORKSPACE_ROOT: /workspaces
      WORKSPACE_MAX_FILE_BYTES: ${WORKSPACE_MAX_FILE_BYTES:-1048576}
      WORKSPACE_MAX_OUTPUT_BYTES: ${WORKSPACE_MAX_OUTPUT_BYTES:-65536}
    volumes:
      - workspace_data:/workspaces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inzozi

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inzozi_code}
      POSTGRES_USER: ${POSTGRES_USER:-inzozi_code}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inzozi_code} -d ${POSTGRES_DB:-inzozi_code}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inzozi

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - inzozi

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - inzozi

volumes:
  postgres_data:
  redis_data:
  workspace_data:

networks:
  inzozi:
    driver: bridge
