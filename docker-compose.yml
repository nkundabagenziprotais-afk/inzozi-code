services:
  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - inzozi

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Inzozi Code}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AQUILA_PROVIDER: ${AQUILA_PROVIDER:-mock}
      AQUILA_MODEL: ${AQUILA_MODEL:-mock-v0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - inzozi

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inzozi_code}
      POSTGRES_USER: ${POSTGRES_USER:-inzozi_code}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inzozi_code} -d ${POSTGRES_DB:-inzozi_code}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inzozi

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - inzozi

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - inzozi

volumes:
  postgres_data:
  redis_data:

networks:
  inzozi:
    driver: bridge
