services:
  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - inzozi

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Inzozi Code}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AQUILA_PROVIDER: ${AQUILA_PROVIDER:-openai}
      AQUILA_MODEL: ${AQUILA_MODEL:-gpt-5.6}
      AQUILA_MAX_TURNS: ${AQUILA_MAX_TURNS:-12}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-5.6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WORKSPACE_SERVICE_URL: ${WORKSPACE_SERVICE_URL:-http://workspace-manager:8200}
      WORKSPACE_OWNERSHIP_ENFORCED: ${WORKSPACE_OWNERSHIP_ENFORCED:-false}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_OWNER: ${GITHUB_APP_OWNER:-}
      GITHUB_APP_DEFAULT_INSTALLATION_ID: ${GITHUB_APP_DEFAULT_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_BOOTSTRAP_ROLE: ${AUTH_BOOTSTRAP_ROLE:-platform_owner}
      AUTH_ORGANIZATION_ID: ${AUTH_ORGANIZATION_ID:-inzozi-digital}
      AUTH_SESSION_TTL_MINUTES: ${AUTH_SESSION_TTL_MINUTES:-480}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      workspace-manager:
        condition: service_healthy
    networks:
      - inzozi

  workspace-manager:
    build:
      context: ./services/workspace/manager
    restart: unless-stopped
    environment:
      WORKSPACE_RUNTIME_IMAGE: ${WORKSPACE_RUNTIME_IMAGE:-inzozi-code-workspace-runtime:local}
      WORKSPACE_API_SERVICE_HOST: api
      WORKSPACE_EGRESS_NETWORK: ${WORKSPACE_EGRESS_NETWORK:-inzozi-workspace-egress}
      WORKSPACE_TTL_SECONDS: ${WORKSPACE_TTL_SECONDS:-28800}
      WORKSPACE_MAX_ACTIVE: ${WORKSPACE_MAX_ACTIVE:-8}
      WORKSPACE_DISK_LIMIT_BYTES: ${WORKSPACE_DISK_LIMIT_BYTES:-2147483648}
      WORKSPACE_RUNTIME_MEMORY_LIMIT: ${WORKSPACE_RUNTIME_MEMORY_LIMIT:-4g}
      WORKSPACE_RUNTIME_CPUS: ${WORKSPACE_RUNTIME_CPUS:-2.0}
      WORKSPACE_RUNTIME_PIDS_LIMIT: ${WORKSPACE_RUNTIME_PIDS_LIMIT:-256}
      WORKSPACE_MAX_FILE_BYTES: ${WORKSPACE_MAX_FILE_BYTES:-1048576}
      WORKSPACE_MAX_OUTPUT_BYTES: ${WORKSPACE_MAX_OUTPUT_BYTES:-65536}
      WORKSPACE_MAX_SEARCH_FILE_BYTES: ${WORKSPACE_MAX_SEARCH_FILE_BYTES:-524288}
      WORKSPACE_MAX_CHECKPOINT_BYTES: ${WORKSPACE_MAX_CHECKPOINT_BYTES:-104857600}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=134217728
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - inzozi

  workspace-runtime-image:
    image: ${WORKSPACE_RUNTIME_IMAGE:-inzozi-code-workspace-runtime:local}
    build:
      context: ./services/workspace/runtime
    profiles:
      - workspace-runtime-image

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inzozi_code}
      POSTGRES_USER: ${POSTGRES_USER:-inzozi_code}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inzozi_code} -d ${POSTGRES_DB:-inzozi_code}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inzozi

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - inzozi

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - inzozi

volumes:
  postgres_data:
  redis_data:

networks:
  inzozi:
    driver: bridge
