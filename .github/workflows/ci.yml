name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.1'
          terraform_wrapper: false
      - name: Compile Python sources
        run: |
          python -m compileall apps/api/app
          python -m compileall services/workspace/runtime/app
          python -m compileall services/workspace/manager/app
          python -m compileall services/workspace/broker/app
          python -m compileall services/workspace/quota-helper/app
          python -m compileall services/workspace/egress-proxy/app
      - name: Test API integrations
        working-directory: apps/api
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
      - name: Test workspace policy
        working-directory: services/workspace/runtime
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
      - name: Test workspace manager policy
        working-directory: services/workspace/manager
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
      - name: Test workspace broker policy
        working-directory: services/workspace/broker
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
      - name: Test workspace egress proxy policy
        working-directory: services/workspace/egress-proxy
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
      - name: Build workspace egress proxy image
        run: |
          docker build \
            --tag inzozi-code-workspace-egress-proxy:ci \
            services/workspace/egress-proxy
      - name: Test workspace quota helper policy
        working-directory: services/workspace/quota-helper
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
      - name: Validate staging shell scripts
        run: |
          bash -n infrastructure/staging/bootstrap-host.sh
          bash -n infrastructure/staging/configure-host-nginx.sh
          bash -n infrastructure/staging/prepare-private-tls.sh
          bash -n infrastructure/staging/https-preflight.sh
          bash -n infrastructure/staging/deploy-staging.sh
          bash -n infrastructure/staging/github-app-preflight.sh
          bash -n infrastructure/staging/auth-preflight.sh
          bash -n infrastructure/staging/seed-database-identity.sh
          bash -n infrastructure/staging/workspace-ownership-preflight.sh
          bash -n infrastructure/staging/dedicated-workspace-preflight.sh
          bash -n infrastructure/hetzner/prepare-local.sh
          bash -n infrastructure/hetzner/up.sh
          bash -n infrastructure/hetzner/bootstrap.sh
          bash -n infrastructure/hetzner/configure-github-app.sh
          bash -n infrastructure/hetzner/resolve-github-installation-id.sh
          bash -n infrastructure/hetzner/configure-staging-auth.sh
          bash -n infrastructure/hetzner/configure-workspace-broker.sh
          bash -n infrastructure/hetzner/configure-workspace-quota-storage.sh
          bash -n infrastructure/hetzner/down.sh
      - name: Validate HTTPS staging templates
        run: |
          grep -q 'listen 80 default_server;' infrastructure/staging/host-nginx-http.conf.template
          grep -q 'listen 443 ssl http2 default_server;' infrastructure/staging/host-nginx.conf.template
          grep -q 'return 308 https://$host$request_uri;' infrastructure/staging/host-nginx.conf.template
          grep -q 'Strict-Transport-Security' infrastructure/staging/host-nginx.conf.template
          grep -q 'Permissions-Policy' infrastructure/staging/host-nginx.conf.template
          grep -q 'Content-Security-Policy' infrastructure/staging/host-nginx.conf.template
          grep -q 'inzozi_login_per_ip' infrastructure/staging/host-nginx.conf.template
          grep -q 'inzozi_api_per_ip' infrastructure/staging/host-nginx.conf.template
          grep -q 'inzozi_expensive_per_ip' infrastructure/staging/host-nginx.conf.template
          grep -q 'limit_req_status 429' infrastructure/staging/host-nginx.conf.template
          grep -q 'limit_conn_status 429' infrastructure/staging/host-nginx.conf.template
          grep -q 'inzozi_login_per_ip' infrastructure/staging/host-nginx-http.conf.template
          grep -q '/etc/inzozi-code/tls/code-staging.inzozidigital.com/' infrastructure/staging/host-nginx.conf.template
          grep -q 'map $http_x_real_ip $inzozi_client_ip' infrastructure/nginx/default.conf
          grep -q 'proxy_set_header X-Real-IP $inzozi_client_ip;' infrastructure/nginx/default.conf
          grep -q 'proxy_set_header X-Forwarded-Proto $inzozi_forwarded_proto;' infrastructure/nginx/default.conf

          python3 - <<'PY'
          from pathlib import Path

          lines = [
              raw.strip().rstrip(";")
              for raw in Path(
                  "infrastructure/staging/host-nginx.conf.template"
              ).read_text().splitlines()
              if raw.strip().startswith("ssl_protocols ")
          ]

          if not lines:
              raise SystemExit("No active ssl_protocols directives")

          expected = ["TLSv1.2", "TLSv1.3"]

          for line in lines:
              protocols = line.split()[1:]

              if protocols != expected:
                  raise SystemExit(
                      f"Invalid TLS protocol policy: {protocols!r}"
                  )

          print("TLS_PROTOCOL_POLICY=PASS")
          PY

          python3 - <<'PY'
          from pathlib import Path

          installer = Path(
              "infrastructure/staging/configure-host-nginx.sh"
          ).read_text()

          activation = installer.index(
              'install -m 0644 "${TEMPLATE}" "${CANDIDATE}"'
          )

          activation_tail = installer[activation:]

          remove_default = activation_tail.index(
              'rm -f "${DEFAULT_ENABLED}"'
          )

          first_active_nginx_test = activation_tail.index(
              'if ! nginx -t; then'
          )

          if remove_default > first_active_nginx_test:
              raise SystemExit(
                  "Ubuntu default site must be removed before candidate nginx -t"
              )

          retry_fragments = (
              'FUNCTIONAL_CHECK_ATTEMPTS=40',
              'FUNCTIONAL_CHECK_SLEEP_SECONDS="0.25"',
              'functional_check_once()',
              'seq 1 "${FUNCTIONAL_CHECK_ATTEMPTS}"',
              'sleep "${FUNCTIONAL_CHECK_SLEEP_SECONDS}"',
              'Functional validation observations:',
          )

          missing_retry_fragments = [
              fragment
              for fragment in retry_fragments
              if fragment not in installer
          ]

          if missing_retry_fragments:
              raise SystemExit(
                  "Missing Nginx reload-handoff retry controls: "
                  + repr(missing_retry_fragments)
              )

          reload_position = installer.index(
              'if ! systemctl reload nginx; then'
          )

          retry_position = installer.index(
              'functional_check_once()'
          )

          if retry_position < reload_position:
              raise SystemExit(
                  "Functional retry loop must run after successful Nginx reload"
              )

          for reviewed_path in (
              "infrastructure/staging/configure-host-nginx.sh",
              "infrastructure/staging/deploy-staging.sh",
              "infrastructure/staging/https-preflight.sh",
          ):
              reviewed_text = Path(reviewed_path).read_text()

              if "EXPECTED_COMMIT_SHA" not in reviewed_text:
                  raise SystemExit(
                      f"Missing reviewed-SHA boundary: {reviewed_path}"
                  )

          variables = Path(
              "infrastructure/hetzner/variables.tf"
          ).read_text()

          if variables.count(
              'cidr != "0.0.0.0/0"'
          ) < 3:
              raise SystemExit(
                  "IPv4 internet-wide CIDR rejection is incomplete"
              )

          if variables.count(
              'cidr != "::/0"'
          ) < 3:
              raise SystemExit(
                  "IPv6 internet-wide CIDR rejection is incomplete"
              )

          print("HOST_NGINX_ACTIVATION_ORDER=PASS")
          print("HOST_NGINX_RELOAD_HANDOFF_RETRY=PASS")
          print("REVIEWED_SHA_BOUNDARIES=PASS")
          print("PRIVATE_WEB_CIDR_REJECTION=PASS")
          PY

          python3 - <<'PY'
          from pathlib import Path

          http_template = Path(
              "infrastructure/staging/host-nginx-http.conf.template"
          ).read_text()

          https_template = Path(
              "infrastructure/staging/host-nginx.conf.template"
          ).read_text()

          required_ingress = (
              "limit_req_zone $binary_remote_addr "
              "zone=inzozi_login_per_ip:10m rate=12r/m;",
              "limit_req_zone $binary_remote_addr "
              "zone=inzozi_api_per_ip:10m rate=15r/s;",
              "limit_req_zone $binary_remote_addr "
              "zone=inzozi_expensive_per_ip:10m rate=30r/m;",
              "limit_conn_zone $binary_remote_addr "
              "zone=inzozi_conn_per_ip:10m;",
              "limit_req_status 429;",
              "limit_conn_status 429;",
              "location = /api/v1/auth/login",
              "location = /api/v1/auth/activate",
              "location = /api/v1/agent/run",
              'location ~ "^/api/v1/workspaces/[0-9a-f]{32}/actions$"',
              "client_max_body_size 16k;",
          )

          unquoted_workspace_regex = (
              "location ~ "
              "^/api/v1/workspaces/[0-9a-f]{32}/actions$ {"
          )

          for template_name, template in (
              ("HTTP", http_template),
              ("HTTPS", https_template),
          ):
              if unquoted_workspace_regex in template:
                  raise SystemExit(
                      f"{template_name} workspace-action regex "
                      "must be quoted for Nginx parsing"
                  )

              missing = [
                  item
                  for item in required_ingress
                  if item not in template
              ]

              if missing:
                  raise SystemExit(
                      f"{template_name} ingress controls missing: "
                      + repr(missing)
                  )

          required_csp = (
              "Content-Security-Policy",
              "default-src 'self'",
              "script-src 'self'",
              "object-src 'none'",
              "base-uri 'self'",
              "form-action 'self'",
              "frame-ancestors 'self'",
              "connect-src 'self'",
              "worker-src 'self' blob:",
              "upgrade-insecure-requests",
          )

          missing_csp = [
              item
              for item in required_csp
              if item not in https_template
          ]

          if missing_csp:
              raise SystemExit(
                  "HTTPS CSP missing directives: "
                  + repr(missing_csp)
              )

          if "'unsafe-eval'" in https_template:
              raise SystemExit(
                  "HTTPS CSP must not contain unsafe-eval"
              )

          preflight = Path(
              "infrastructure/staging/https-preflight.sh"
          ).read_text()

          for required in (
              "CONTENT_SECURITY_POLICY=PASS",
              "INGRESS_ABUSE_CONTROLS=PASS",
              "inzozi_login_per_ip",
              "unsafe-eval",
          ):
              if required not in preflight:
                  raise SystemExit(
                      "HTTPS preflight missing Issue #36 check: "
                      + required
                  )

          print("PUBLIC_INGRESS_RATE_CONTROLS=PASS")
          print("CONTENT_SECURITY_POLICY_STATIC=PASS")
          print("NO_SCRIPT_UNSAFE_EVAL=PASS")
          PY

          TMP_TLS="$(mktemp -d)"
          trap 'rm -rf "${TMP_TLS}"' EXIT

          mkdir -p \
            "${TMP_TLS}/certs"

          openssl req \
            -x509 \
            -newkey rsa:2048 \
            -nodes \
            -days 1 \
            -subj '/CN=code-staging.inzozidigital.com' \
            -keyout "${TMP_TLS}/certs/privkey.pem" \
            -out "${TMP_TLS}/certs/fullchain.pem" \
            >/dev/null 2>&1

          docker run --rm \
            -v "$PWD/infrastructure/staging/host-nginx-http.conf.template:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine \
            nginx -t

          docker run --rm \
            -v "$PWD/infrastructure/staging/host-nginx.conf.template:/etc/nginx/conf.d/default.conf:ro" \
            -v "${TMP_TLS}/certs:/etc/inzozi-code/tls/code-staging.inzozidigital.com:ro" \
            nginx:1.27-alpine \
            nginx -t

          docker run --rm \
            --add-host api:127.0.0.1 \
            --add-host web:127.0.0.1 \
            -v "$PWD/infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine \
            nginx -t

      - name: Validate Hetzner Terraform
        working-directory: infrastructure/hetzner
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate staging Compose configuration
        env:
          DATABASE_URL: postgresql://inzozi_code:test@postgres:5432/inzozi_code
          REDIS_URL: redis://redis:6379/0
          POSTGRES_PASSWORD: test-only
          GITHUB_APP_PRIVATE_KEY_HOST_PATH: /tmp/inzozi-ci-github-app.pem
          AUTH_ENABLED: "true"
          AUTH_BOOTSTRAP_EMAIL: ci@inzozidigital.com
          AUTH_PASSWORD_HASH: pbkdf2_sha256$600000$test$test
          AUTH_SESSION_SECRET: ci-only-session-secret-00000000000000000000000000000000
          WORKSPACE_BROKER_TOKEN: ci-only-workspace-broker-token-00000000000000000000000000000000
          WORKSPACE_QUOTA_STORAGE_ROOT: /srv/inzozi-code/workspace-data
          WORKSPACE_QUOTA_HELPER_IMAGE: inzozi-code-workspace-quota-helper:local
        run: |
          touch /tmp/inzozi-ci-github-app.pem
          docker compose \
            -f docker-compose.yml \
            -f infrastructure/staging/docker-compose.staging.yml \
            config --quiet
          docker compose \
            -f docker-compose.yml \
            -f infrastructure/staging/docker-compose.staging.yml \
            --profile workspace-runtime-image \
            config --quiet

  api-redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inzozi_code
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: inzozi_code
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inzozi_code -d inzozi_code"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test durable Redis auth-state controls
        working-directory: apps/api
        env:
          RUN_REDIS_INTEGRATION: "1"
          REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_auth_redis_integration.py
      - name: Test durable PostgreSQL identity controls
        working-directory: apps/api
        env:
          RUN_POSTGRES_INTEGRATION: "1"
          DATABASE_URL: postgresql://inzozi_code:test-only@127.0.0.1:5432/inzozi_code
          AUTH_ENABLED: "true"
          AUTH_IDENTITY_MODE: database
          AUTH_SESSION_SECRET: ci-only-session-secret-00000000000000000000000000000000
          REDIS_URL: redis://127.0.0.1:6379/14
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_identity_postgres_integration.py

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: apps/web
        run: npm install
      - name: Build
        working-directory: apps/web
        run: npm run build
