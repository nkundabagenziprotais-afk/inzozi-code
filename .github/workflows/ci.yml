name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.1'
          terraform_wrapper: false
      - name: Compile Python sources
        run: |
          python -m compileall apps/api/app
          python -m compileall services/workspace/runtime/app
      - name: Test API integrations
        working-directory: apps/api
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
      - name: Test workspace policy
        working-directory: services/workspace/runtime
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
      - name: Validate staging shell scripts
        run: |
          bash -n infrastructure/staging/bootstrap-host.sh
          bash -n infrastructure/staging/deploy-staging.sh
          bash -n infrastructure/hetzner/prepare-local.sh
          bash -n infrastructure/hetzner/up.sh
          bash -n infrastructure/hetzner/bootstrap.sh
          bash -n infrastructure/hetzner/down.sh
      - name: Validate Hetzner Terraform
        working-directory: infrastructure/hetzner
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate staging Compose configuration
        env:
          DATABASE_URL: postgresql://inzozi_code:test@postgres:5432/inzozi_code
          REDIS_URL: redis://redis:6379/0
          POSTGRES_PASSWORD: test-only
          GITHUB_APP_PRIVATE_KEY_HOST_PATH: /tmp/inzozi-ci-github-app.pem
        run: |
          touch /tmp/inzozi-ci-github-app.pem
          docker compose \
            -f docker-compose.yml \
            -f infrastructure/staging/docker-compose.staging.yml \
            config --quiet

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: apps/web
        run: npm install
      - name: Build
        working-directory: apps/web
        run: npm run build
