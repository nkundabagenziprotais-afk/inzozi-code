name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: |
          python -m compileall apps/api/app
          python -m compileall services/workspace/runtime/app
      - name: Test API integrations
        working-directory: apps/api
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
      - name: Test workspace policy
        working-directory: services/workspace/runtime
        run: |
          python -m pip install -e '.[dev]'
          pytest -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: apps/web
        run: npm install
      - name: Build
        working-directory: apps/web
        run: npm run build
