name: Product Control

on:
  pull_request:
    paths:
      - 'apps/api/app/main.py'
      - 'apps/api/app/product/**'
      - 'apps/api/app/routes/products.py'
      - 'apps/api/app/routes/product_engineering.py'
      - 'apps/api/tests/test_product_*.py'
      - 'apps/web/src/StudioShell.tsx'
      - 'apps/web/src/SolutionModules.tsx'
      - 'apps/web/src/InzoziSolutionSync.tsx'
      - 'apps/web/src/studio-shell.css'
      - 'apps/web/src/studio-shell-refinement.css'
      - 'apps/web/src/studio-live-review.css'
      - 'apps/web/src/studio-engineering-sync.css'
      - 'apps/web/src/module-delivery.css'
      - 'apps/web/src/unified-shell.css'
      - 'apps/web/src/unified-shell.ts'
      - 'apps/web/src/main.tsx'
      - '.github/workflows/product-control.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/app/main.py'
      - 'apps/api/app/product/**'
      - 'apps/api/app/routes/products.py'
      - 'apps/api/app/routes/product_engineering.py'
      - 'apps/api/tests/test_product_*.py'
      - 'apps/web/src/StudioShell.tsx'
      - 'apps/web/src/SolutionModules.tsx'
      - 'apps/web/src/InzoziSolutionSync.tsx'
      - 'apps/web/src/studio-shell.css'
      - 'apps/web/src/studio-shell-refinement.css'
      - 'apps/web/src/studio-live-review.css'
      - 'apps/web/src/studio-engineering-sync.css'
      - 'apps/web/src/module-delivery.css'
      - 'apps/web/src/unified-shell.css'
      - 'apps/web/src/unified-shell.ts'
      - 'apps/web/src/main.tsx'
      - '.github/workflows/product-control.yml'

jobs:
  product-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inzozi_code
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: inzozi_code
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inzozi_code -d inzozi_code"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test product planning, durable product state and engineering synchronization
        working-directory: apps/api
        env:
          RUN_POSTGRES_INTEGRATION: "1"
          DATABASE_URL: postgresql://inzozi_code:test-only@127.0.0.1:5432/inzozi_code
        run: |
          python -m pip install -e '.[dev]'
          pytest -q \
            tests/test_product_planning.py \
            tests/test_product_postgres_integration.py \
            tests/test_product_engineering_postgres_integration.py

  product-web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: apps/web
        run: npm install
      - name: Verify Aquila Studio scrolling contract
        working-directory: apps/web
        run: |
          grep -Fq 'height: 100dvh;' src/studio-shell-refinement.css
          grep -Fq 'overflow-y: auto;' src/studio-shell-refinement.css
          grep -Fq 'overscroll-behavior-y: contain;' src/studio-shell-refinement.css
          grep -Fq 'touch-action: pan-x;' src/studio-shell-refinement.css
      - name: Verify solution module roadmap contract
        working-directory: apps/web
        run: |
          grep -Fq 'SOLUTION DEVELOPMENT' src/SolutionModules.tsx
          grep -Fq 'Must have' src/SolutionModules.tsx
          grep -Fq 'Should have' src/SolutionModules.tsx
          grep -Fq 'Good to have' src/SolutionModules.tsx
          grep -Fq 'Pending' src/SolutionModules.tsx
          grep -Fq 'Closed' src/SolutionModules.tsx
          grep -Fq 'min-height: 44px;' src/studio-live-review.css
      - name: Verify module-driven solution delivery contract
        working-directory: apps/web
        run: |
          grep -Fq 'Select module' src/InzoziSolutionSync.tsx
          grep -Fq 'Select deliverable' src/InzoziSolutionSync.tsx
          if grep -Fq '>General engineering<' src/InzoziSolutionSync.tsx; then
            echo 'General engineering must not masquerade as an intended module' >&2
            exit 1
          fi
          grep -Fq 'engineering/deliverables/' src/InzoziSolutionSync.tsx
          grep -Fq 'REVIEW-ONLY SUGGESTIONS' src/SolutionModules.tsx
          grep -Fq 'Nothing becomes approved scope until you add it.' src/SolutionModules.tsx
          grep -Fq 'Derived from accepted deliverables' src/SolutionModules.tsx
          grep -Fq 'MY SOLUTIONS' src/unified-shell.ts
          grep -Fq 'Continue in Engineering Space' src/unified-shell.ts
          grep -Fq "import './module-delivery.css'" src/main.tsx
          grep -Fq '.studio-module-delivery-track' src/module-delivery.css
      - name: Verify Inzozi AI-Coding Product ↔ Engineering synchronization contract
        working-directory: apps/web
        run: |
          grep -Fq 'Inzozi AI-Coding' src/InzoziSolutionSync.tsx
          grep -Fq 'Project Control Center' src/InzoziSolutionSync.tsx
          grep -Fq 'Engineering Space' src/InzoziSolutionSync.tsx
          grep -Fq 'workspace_opened' src/InzoziSolutionSync.tsx
          grep -Fq 'command_completed' src/InzoziSolutionSync.tsx
          grep -Fq 'git_review_prepared' src/InzoziSolutionSync.tsx
          grep -Fq 'commit_created' src/InzoziSolutionSync.tsx
          grep -Fq 'push_completed' src/InzoziSolutionSync.tsx
          grep -Fq 'pull_request_created' src/InzoziSolutionSync.tsx
          grep -Fq 'One solution · synchronized delivery' src/InzoziSolutionSync.tsx
          grep -Fq 'height: 100dvh;' src/studio-engineering-sync.css
          grep -Fq 'min-height: 44px;' src/studio-engineering-sync.css
      - name: Verify unified Inzozi AI-Coding shell contract
        working-directory: apps/web
        run: |
          grep -Fq '.inzozi-delivery-body .studio-topbar' src/unified-shell.css
          grep -Fq '.inzozi-delivery-body .app-shell > .topbar' src/unified-shell.css
          grep -Fq '.inzozi-delivery-body .studio-return-control' src/unified-shell.css
          grep -Fq "data-unified-nav" src/unified-shell.ts
          grep -Fq 'goToProjectControl' src/unified-shell.ts
          grep -Fq 'goToEngineering' src/unified-shell.ts
          grep -Fq "import './unified-shell.css'" src/main.tsx
          grep -Fq "import './unified-shell'" src/main.tsx
          grep -Fq 'top: 10px;' src/unified-shell.css
          grep -Fq 'margin-right: 198px;' src/unified-shell.css
      - name: Verify unified shell normalization is mutation-safe
        working-directory: apps/web
        run: |
          grep -Fq "if (emptySolution && emptySolution.textContent?.trim() !== 'Select a solution')" src/unified-shell.ts
          if grep -Fq "if (emptySolution) emptySolution.textContent = 'Select a solution'" src/unified-shell.ts; then
            echo 'unguarded empty-state text mutation would retrigger the MutationObserver indefinitely' >&2
            exit 1
          fi
      - name: Build Aquila Studio product-control UI
        working-directory: apps/web
        run: npm run build
