# Host Nginx is the only normal external ingress path to this container.
# The Docker Nginx port is published on host loopback only. Preserve the
# client identity supplied by host Nginx; fall back to the immediate peer
# for direct private-loopback development/testing requests.
map $http_x_real_ip $inzozi_client_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

map $http_x_forwarded_proto $inzozi_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /api/ {
        # The API only trusts X-Real-IP from its immediate Docker Nginx
        # peer. Host Nginx overwrites the external X-Real-IP value, and
        # this layer deliberately preserves that trusted value.
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $inzozi_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $inzozi_forwarded_proto;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://api:8000/ready;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $inzozi_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $inzozi_forwarded_proto;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
