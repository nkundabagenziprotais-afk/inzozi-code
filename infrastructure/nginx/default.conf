server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /api/ {
        # Trusted reverse-proxy hop for the API. X-Real-IP is set from $remote_addr only.
        # The API ignores X-Forwarded-For for login-rate identity and only honors X-Real-IP
        # when the immediate TCP peer is listed in AUTH_TRUSTED_PROXIES (default: nginx).
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://api:8000/ready;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
