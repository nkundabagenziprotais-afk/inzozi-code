services:
  platform-web:
    build:
      context: ./apps/platform-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PLATFORM_WEB_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    labels:
      com.inzozi.digital.role: parent-platform-web
    networks:
      - inzozi
