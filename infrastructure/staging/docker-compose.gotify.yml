services:
  gotify:
    image: ${GOTIFY_IMAGE:?Set immutable gotify/server:3.1.0 image digest}
    restart: unless-stopped

    environment:
      GOTIFY_SERVER_PORT: "8080"
      GOTIFY_SERVER_SSL_ENABLED: "false"
      GOTIFY_DEFAULTUSER_NAME: "admin"
      GOTIFY_DEFAULTUSER_PASS_FILE: /run/secrets/gotify-admin-password
      GOTIFY_REGISTRATION: "false"
      GOTIFY_PLUGINSDIR: ""
      GOTIFY_LOGLEVEL: "info"

    volumes:
      - "${GOTIFY_DATA_DIR:-/srv/inzozi-code/gotify-data}:/app/data"
      - "${GOTIFY_ADMIN_PASSWORD_FILE_HOST:-/srv/inzozi-code/secrets/gotify-admin-password}:/run/secrets/gotify-admin-password:ro"

    ports:
      - "127.0.0.1:8088:8080"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16777216

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128
    mem_limit: 256m
    cpus: 0.25

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      com.inzozi.code.role: gotify-alerting
      com.inzozi.code.issue: "39"

    networks:
      - gotify-alerting

networks:
  gotify-alerting:
    driver: bridge
    internal: true
